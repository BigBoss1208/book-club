{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Tham gia Câu lạc bộ</h2>
    {% if existing and existing.status == 'REJECTED' %}
        <div class="alert alert-danger">Đơn đăng ký của bạn đã bị từ chối. Bạn có thể gửi lại đơn đăng ký.</div>
    {% elif existing %}
        <div class="alert alert-info">Bạn đã gửi đơn đăng ký. Vui lòng chờ xét duyệt.</div>
    {% endif %}
    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <label for="motivation" class="form-label">Lý do muốn tham gia CLB</label>
            <textarea class="form-control" id="motivation" name="motivation" rows="4" required>{{ request.POST.motivation }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Gửi đơn đăng ký</button>
    </form>
</div>
{% endblock %}
