{% extends 'base.html' %}
{% block content %}
<div class="container mt-3">
    <h5 class="mb-3">{{ book.title }}</h5>
    <div class="d-flex justify-content-center align-items-center gap-3 mb-2">
        <button id="prevPage" class="btn btn-sm btn-outline-secondary">&laquo; Trang trước</button>
        <span><span id="pageNum"></span> / <span id="pageCount"></span></span>
        <button id="nextPage" class="btn btn-sm btn-outline-secondary">Trang sau &raquo;</button>
    </div>
    <div style="overflow-x:auto; text-align:center; background:#525659; padding:10px;">
        <canvas id="pdfCanvas" style="max-width:100%;"></canvas>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    const url = "{% url 'library:serve_ebook' book.pk %}";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pdfDoc = null, pageNum = 1;
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    function renderPage(num) {
        pdfDoc.getPage(num).then(function(page) {
            const containerWidth = canvas.parentElement.clientWidth - 20;
            const unscaled = page.getViewport({ scale: 1 });
            const scale = containerWidth / unscaled.width;
            const viewport = page.getViewport({ scale: scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            page.render({ canvasContext: ctx, viewport: viewport });
            document.getElementById('pageNum').textContent = num;
        });
    }

    pdfjsLib.getDocument(url).promise.then(function(pdf) {
        pdfDoc = pdf;
        document.getElementById('pageCount').textContent = pdf.numPages;
        renderPage(pageNum);
    });

    document.getElementById('prevPage').addEventListener('click', function() {
        if (pageNum <= 1) return;
        pageNum--;
        renderPage(pageNum);
    });
    document.getElementById('nextPage').addEventListener('click', function() {
        if (pageNum >= pdfDoc.numPages) return;
        pageNum++;
        renderPage(pageNum);
    });
</script>
{% endblock %}
